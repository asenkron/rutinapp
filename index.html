<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bora'nın Rutin Çarkı</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bora'nın Günü">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/sun.png">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1C1E24;
      --card-active: #262932;
      --card-done: #16181D;
      --primary: #FF5E3A;
      --accent: #2979FF;
      --success: #00E676;
      --text: #F5F6FA;
      --text-muted: #8E94A5;
      --border: #2B2F3A;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      user-select: none;
    }

    /* Üst Bar */
    header {
      background: var(--card-bg);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 193, 7, 0.15);
      border: 1px solid rgba(255, 193, 7, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #FFD54F;
    }

    /* Gün Seçici */
    .days-nav {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg);
      scrollbar-width: none;
    }
    .days-nav::-webkit-scrollbar { display: none; }
    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
    }
    .day-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(255, 94, 58, 0.35);
    }

    /* Freeletics İlerleme Bölümü */
    .progress-section {
      padding: 14px 18px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.3s ease;
    }

    /* Freeletics Zaman Tüneli / Liste */
    .timeline-container {
      padding: 16px 18px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 580px;
      margin: 0 auto;
      width: 100%;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      transition: all 0.25s ease;
    }
    .task-card.active-step {
      border-color: var(--primary);
      background: var(--card-active);
      box-shadow: 0 6px 20px rgba(255, 94, 58, 0.18);
      transform: scale(1.01);
    }
    .task-card.done {
      background: var(--card-done);
      border-color: rgba(0, 230, 118, 0.2);
      opacity: 0.65;
    }
    .task-card.done .task-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Durum ve Piktogram Çemberi */
    .visual-avatar {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #232731;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.1rem;
      flex-shrink: 0;
      position: relative;
      border: 2px solid var(--border);
    }
    .task-card.active-step .visual-avatar {
      border-color: var(--primary);
      background: #2E2827;
    }
    .task-card.done .visual-avatar {
      border-color: var(--success);
    }

    .task-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-time {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
    .task-card.done .task-time {
      color: var(--text-muted);
    }
    .task-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Freeletics Tarzı Tamamla / Tik Düğmesi */
    .btn-check {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #22252E;
      color: #585F73;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .task-card.active-step .btn-check {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(255, 94, 58, 0.1);
    }
    .task-card.done .btn-check {
      background: var(--success);
      border-color: var(--success);
      color: #121316;
      font-weight: 900;
    }

    .btn-sound-mini {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    /* Alt Araçlar (Günü Sıfırla vb.) */
    .list-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }
    .btn-reset-day {
      background: #232731;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Modal / Parent Panel */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-content {
      background: #1C1E24;
      width: 100%;
      max-width: 540px;
      border-radius: 28px 28px 0 0;
      padding: 22px 18px;
      max-height: 88vh;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .catalog-item {
      background: #262932;
      padding: 10px 6px;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }
    .catalog-item span { font-size: 1.9rem; display: block; margin-bottom: 4px; }
    .parent-task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #262932;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .time-input-inline {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 6px;
      font-weight: 800;
      color: #FFF;
      background: #121316;
      font-size: 0.95rem;
      outline: none;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-secondary {
      background: #262932;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* 50MM TERMAL BASKI TASARIMI */
    @media print {
      @page {
        size: 50mm auto;
        margin: 0;
      }
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        margin: 0;
        padding: 0;
      }
      header, .days-nav, .progress-section, .timeline-container, .modal, .no-print {
        display: none !important;
      }
      #print-thermal-receipt {
        display: block !important;
        width: 48mm;
        margin: 0 auto;
        padding: 4mm 1mm;
        font-family: -apple-system, monospace;
        font-size: 11px;
        color: #000;
      }
      .thermal-header {
        text-align: center;
        border-bottom: 1px dashed #000;
        padding-bottom: 4px;
        margin-bottom: 6px;
      }
      .thermal-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 0.5px solid #eee;
      }
      .thermal-time {
        font-weight: 800;
        font-size: 11px;
        width: 38px;
      }
      .thermal-icon {
        font-size: 16px;
        margin: 0 4px;
      }
      .thermal-title {
        flex: 1;
        font-weight: 700;
        font-size: 10px;
      }
      .thermal-star {
        font-size: 15px;
        font-weight: normal;
        margin-left: 2px;
      }
    }
    #print-thermal-receipt { display: none; }
  </style>
</head>
<body>

  <header class="no-print">
    <div class="score-badge">
      <span>⭐</span>
      <span id="star-count">0</span>
    </div>
    <div style="font-weight: 900; letter-spacing: 0.5px; font-size: 1.1rem; color: #FFF;">BORA'NIN SEANSI</div>
    <button onclick="openParentModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:#FFF;">⚙️</button>
  </header>

  <div class="days-nav no-print" id="days-container"></div>

  <!-- Freeletics Progress Bar -->
  <div class="progress-section no-print">
    <div class="progress-meta">
      <span id="progress-label">0 / 0 TAMAMLANDI</span>
      <span id="progress-pct">%0</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Dikey Freeletics Akışı -->
  <div class="timeline-container no-print" id="timeline-list"></div>

  <div class="list-footer no-print">
    <button class="btn-reset-day" onclick="resetTodayTasks()">↺ Günü Yeniden Başlat</button>
  </div>

  <!-- 50 mm Termal Çıktı -->
  <div id="print-thermal-receipt">
    <div class="thermal-header">
      <div style="font-size: 13px; font-weight: 900;">BORA'NIN PLANI</div>
      <div id="thermal-day-name" style="font-size: 11px; font-weight: 800; margin-top:2px;">PAZARTESİ</div>
    </div>
    <div id="thermal-rows"></div>
    <div style="text-align: center; margin-top: 8px; font-size: 9px; border-top: 1px dashed #000; padding-top: 4px;">
      ★ Aferin Bora! ★
    </div>
  </div>

  <!-- Ebeveyn Yönetim Paneli -->
  <div class="modal" id="parent-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items:center; margin-bottom: 14px;">
        <h3 style="margin:0; color:#FFF;">Ebeveyn & Günlük Plan</h3>
        <button onclick="closeParentModal()" style="border:none; background:none; font-size:1.4rem; color:#8E94A5; cursor:pointer;">✕</button>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <button class="btn-primary" style="flex:1;" onclick="printReceipt50mm()">🖨️ 50mm Termal Yazdır</button>
        <button class="btn-secondary" onclick="resetStars()">⭐ Sıfırla</button>
      </div>

      <h4 style="margin: 10px 0 6px 0; color:#8E94A5;">Havuzdan Görev Ekle</h4>
      <div class="catalog-grid" id="catalog-list"></div>

      <h4 style="margin: 14px 0 6px 0; color:#8E94A5;">Özel Resim / Görev Ekle</h4>
      <div style="display:flex; flex-direction:column; gap:8px; background:#262932; padding:10px; border-radius:12px;">
        <input type="text" id="custom-title" placeholder="Görev Adı" style="padding:8px; border:1px solid var(--border); border-radius:8px; background:#121316; color:#FFF;">
        <div style="display:flex; gap:6px; align-items:center;">
          <input type="time" id="custom-time" value="09:00" class="time-input-inline">
          <input type="file" id="custom-photo" accept="image/*" style="font-size:0.8rem; flex:1; color:#8E94A5;">
        </div>
        <button class="btn-secondary" style="background:var(--accent); color:white; border:none;" onclick="addCustomTask()">Listeye Ekle</button>
      </div>

      <h4 style="margin: 16px 0 6px 0; color:#8E94A5;" id="current-day-label">Seçili Günün Görevleri</h4>
      <div id="parent-task-list"></div>
    </div>
  </div>

  <script>
    const DAYS = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
    const DAY_NAMES = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
    let selectedDayIdx = 0;
    let starCount = parseInt(localStorage.getItem('bora_stars') || '0');

    const CATALOG = [
      { title: "Kesme Biçme Vakti", icon: "✂️", dur: 20 },
      { title: "Kitap Okuma", icon: "📖", dur: 15 },
      { title: "Spor", icon: "⚽", dur: 30 },
      { title: "Keşif", icon: "🔍", dur: 25 },
      { title: "Bisiklet", icon: "🚲", dur: 30 },
      { title: "Scooter", icon: "🛴", dur: 25 },
      { title: "Opruimen (Toplama)", icon: "🧸", dur: 15 },
      { title: "Bulaşıkları Toplama", icon: "🍽️", dur: 10 },
      { title: "Masa Hazırlama", icon: "🥣", dur: 10 },
      { title: "Yüzme", icon: "🏊‍♂️", dur: 45 },
      { title: "Müzik", icon: "🎵", dur: 20 },
      { title: "Okul", icon: "🎒", dur: 60 },
      { title: "Diş Fırçalama", icon: "🪥", dur: 5 },
      { title: "Banyo Vakti", icon: "🛁", dur: 20 },
      { title: "Uyku Vakti", icon: "🌙", dur: 15 }
    ];

    let schedules = JSON.parse(localStorage.getItem('bora_schedules') || '{}');

    // Kalıcı tamamlanan görevler deposu { "dayIndex_taskIndex": true }
    let completedStore = JSON.parse(localStorage.getItem('bora_completed_tasks') || '{}');

    if (!schedules[0]) {
      schedules = {
        0: [
          { title: "Kahvaltı & Masa", icon: "🥣", time: "08:00", dur: 20 },
          { title: "Okul Hazırlığı", icon: "🎒", time: "08:30", dur: 15 },
          { title: "Kitap Okuma", icon: "📖", time: "16:30", dur: 20 },
          { title: "Opruimen", icon: "🧸", time: "18:00", dur: 15 },
          { title: "Uyku Vakti", icon: "🌙", time: "20:30", dur: 15 }
        ]
      };
      for (let i = 1; i < 7; i++) {
        schedules[i] = JSON.parse(JSON.stringify(schedules[0]));
      }
      saveSchedules();
    }

    function saveSchedules() {
      localStorage.setItem('bora_schedules', JSON.stringify(schedules));
    }

    function saveCompletedStore() {
      localStorage.setItem('bora_completed_tasks', JSON.stringify(completedStore));
    }

    function sortTasksByTime() {
      if (schedules[selectedDayIdx]) {
        schedules[selectedDayIdx].sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
      }
    }

    function init() {
      document.getElementById('star-count').innerText = starCount;
      renderDays();
      renderCatalog();
      loadDay(0);
    }

    function renderDays() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';
      DAYS.forEach((day, idx) => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${idx === selectedDayIdx ? 'active' : ''}`;
        btn.innerText = day;
        btn.onclick = () => loadDay(idx);
        container.appendChild(btn);
      });
    }

    function loadDay(idx) {
      selectedDayIdx = idx;
      renderDays();
      renderTimeline();
    }

    function getTasks() {
      return schedules[selectedDayIdx] || [];
    }

    function renderTimeline() {
      const tasks = getTasks();
      const container = document.getElementById('timeline-list');
      container.innerHTML = '';

      if (!tasks || tasks.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:700;">Bu güne ait plan yok 🏖️</div>`;
        updateProgress(0, 0);
        return;
      }

      let doneCount = 0;
      let firstUnfinishedFound = false;

      tasks.forEach((t, i) => {
        const isDone = !!completedStore[`${selectedDayIdx}_${i}`];
        if (isDone) doneCount++;

        const isCurrentActive = !isDone && !firstUnfinishedFound;
        if (isCurrentActive) firstUnfinishedFound = true;

        const card = document.createElement('div');
        card.className = `task-card ${isDone ? 'done' : ''} ${isCurrentActive ? 'active-step' : ''}`;

        const avatarContent = t.photo 
          ? `<img src="${t.photo}" style="width:100%; height:100%; border-radius:14px; object-fit:cover;">` 
          : (t.icon || '⭐');

        card.innerHTML = `
          <div class="visual-avatar">${avatarContent}</div>
          <div class="task-info">
            <span class="task-time">${t.time || '--:--'}</span>
            <span class="task-name">${t.title}</span>
          </div>
          <button class="btn-sound-mini" onclick="speakTask('${t.title}')" title="Sesli Dinle">🔊</button>
          <button class="btn-check" onclick="toggleTask(${i})">
            ${isDone ? '✓' : (isCurrentActive ? '▶' : '○')}
          </button>
        `;
        container.appendChild(card);
      });

      updateProgress(doneCount, tasks.length);
    }

    function updateProgress(done, total) {
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progress-label').innerText = `${done} / ${total} TAMAMLANDI`;
      document.getElementById('progress-pct').innerText = `%${pct}`;
      document.getElementById('progress-bar-fill').style.width = `${pct}%`;
    }

    function toggleTask(index) {
      const key = `${selectedDayIdx}_${index}`;
      const wasDone = !!completedStore[key];

      if (!wasDone) {
        completedStore[key] = true;
        starCount += 1;
        document.getElementById('star-count').innerText = starCount;
        localStorage.setItem('bora_stars', starCount);
        playSuccessSound();
        confetti({ particleCount: 70, spread: 50, origin: { y: 0.7 } });
      } else {
        delete completedStore[key];
      }

      saveCompletedStore();
      renderTimeline();
    }

    function resetTodayTasks() {
      if (confirm("Seçili günün görevlerini baştan başlatmak istiyor musunuz?")) {
        const tasks = getTasks();
        tasks.forEach((_, i) => {
          delete completedStore[`${selectedDayIdx}_${i}`];
        });
        saveCompletedStore();
        renderTimeline();
      }
    }

    function playSuccessSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1040, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function speakTask(text) {
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'tr-TR';
      window.speechSynthesis.speak(msg);
    }

    /* Ebeveyn Yönetimi */
    function openParentModal() {
      const code = prompt("Ebeveyn Kilidi: 3 + 4 = ?");
      if (code === "7") {
        document.getElementById('parent-modal').style.display = 'flex';
        renderParentTaskList();
      }
    }

    function closeParentModal() {
      document.getElementById('parent-modal').style.display = 'none';
      renderTimeline();
    }

    function renderCatalog() {
      const el = document.getElementById('catalog-list');
      el.innerHTML = '';
      CATALOG.forEach(item => {
        const d = document.createElement('div');
        d.className = 'catalog-item';
        d.innerHTML = `<span>${item.icon}</span>${item.title}`;
        d.onclick = () => addTaskFromCatalog(item);
        el.appendChild(d);
      });
    }

    function addTaskFromCatalog(item) {
      const suggestedTime = prompt(`"${item.title}" için başlangıç saati:`, "12:00");
      if (suggestedTime === null) return;

      if (!schedules[selectedDayIdx]) schedules[selectedDayIdx] = [];
      schedules[selectedDayIdx].push({
        title: item.title,
        icon: item.icon,
        time: suggestedTime.trim() || "12:00",
        dur: item.dur
      });
      sortTasksByTime();
      saveSchedules();
      renderParentTaskList();
    }

    function addCustomTask() {
      const title = document.getElementById('custom-title').value.trim();
      const time = document.getElementById('custom-time').value;
      const fileInput = document.getElementById('custom-photo');

      if (!title) return alert("Lütfen bir başlık girin.");

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          schedules[selectedDayIdx].push({
            title: title,
            photo: e.target.result,
            time: time,
            dur: 20
          });
          sortTasksByTime();
          saveSchedules();
          renderParentTaskList();
          document.getElementById('custom-title').value = '';
          fileInput.value = '';
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        schedules[selectedDayIdx].push({
          title: title,
          icon: "🎯",
          time: time,
          dur: 20
        });
        sortTasksByTime();
        saveSchedules();
        renderParentTaskList();
        document.getElementById('custom-title').value = '';
      }
    }

    function updateTaskTime(index, newTime) {
      if (schedules[selectedDayIdx] && schedules[selectedDayIdx][index]) {
        schedules[selectedDayIdx][index].time = newTime;
        sortTasksByTime();
        saveSchedules();
        renderParentTaskList();
      }
    }

    function renderParentTaskList() {
      document.getElementById('current-day-label').innerText = `${DAY_NAMES[selectedDayIdx]} Görevleri`;
      const el = document.getElementById('parent-task-list');
      el.innerHTML = '';
      const tasks = getTasks();

      tasks.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = 'parent-task-item';
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px; flex:1;">
            <span>${t.photo ? '📷' : (t.icon || '⭐')}</span>
            <input type="time" class="time-input-inline" value="${t.time || '12:00'}" 
                   onchange="updateTaskTime(${i}, this.value)">
            <span style="font-size:0.9rem; font-weight:700; color:#FFF;">${t.title}</span>
          </div>
          <div>
            <button onclick="deleteTask(${i})" style="color:#FF5252; border:none; background:none; font-size:1.1rem; cursor:pointer; padding:4px;">🗑️</button>
          </div>
        `;
        el.appendChild(row);
      });
    }

    function deleteTask(index) {
      schedules[selectedDayIdx].splice(index, 1);
      saveSchedules();
      renderParentTaskList();
    }

    function resetStars() {
      starCount = 0;
      localStorage.setItem('bora_stars', '0');
      document.getElementById('star-count').innerText = 0;
      alert("Yıldızlar sıfırlandı!");
    }

    function printReceipt50mm() {
      const tasks = getTasks();
      if (!tasks || tasks.length === 0) return alert("Yazdırılacak görev bulunamadı.");

      document.getElementById('thermal-day-name').innerText = DAY_NAMES[selectedDayIdx].toUpperCase();
      const container = document.getElementById('thermal-rows');
      container.innerHTML = '';

      tasks.forEach(t => {
        const row = document.createElement('div');
        row.className = 'thermal-row';
        row.innerHTML = `
          <span class="thermal-time">${t.time || '--:--'}</span>
          <span class="thermal-icon">${t.icon || '★'}</span>
          <span class="thermal-title">${t.title}</span>
          <span class="thermal-star">☆</span>
        `;
        container.appendChild(row);
      });

      window.print();
    }

    init();
  </script>
</body>
</html>
